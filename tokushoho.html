<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特定商取引法の表記｜East Side Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>

<!-- ===== 特定商取引法の表記 =====
  自社商品を HP で売るので必要。項目だけの下書き。販売者の名前・住所・電話番号の出し方は決めてから入れる
  （このリポジトリには番地・電話番号を書かない決まり。本番で入れる）。 -->

<div class="wrap"><section class="band plain">
  <div class="inner">
    <div>
      <p class="eyebrow">Legal notice</p>
      <h1 style="font-size:clamp(26px,3.4vw,38px)">特定商取引法に基づく表記</h1>
      <p class="note">（下書き：項目だけ。中身は決まってから入れます［仮］）</p>
      <table class="table">
        <tr><th>販売者</th><td>［決まったら入れる］</td></tr>
        <tr><th>運営の責任者</th><td>［決まったら入れる］</td></tr>
        <tr><th>所在地</th><td>［決まったら入れる。請求があれば遅れなく出す形にできるか確かめる］</td></tr>
        <tr><th>電話番号</th><td>［同上］</td></tr>
        <tr><th>メール</th><td>［決まったら入れる］</td></tr>
        <tr><th>販売価格</th><td>各商品のページに書きます</td></tr>
        <tr><th>商品代金以外の料金</th><td>送料［決まったら入れる］</td></tr>
        <tr><th>支払いの方法</th><td>［売り場が決まったら入れる］</td></tr>
        <tr><th>支払いの時期</th><td>［同上］</td></tr>
        <tr><th>お届けの時期</th><td>［予約販売にするなら、予約の締め切りとお届けの月］</td></tr>
        <tr><th>返品・交換</th><td>［決まったら入れる］</td></tr>
      </table>
    </div>
  </div>
</section></div>

<script src="data.js"></script>
<script src="site.js"></script>
</body>
</html>
