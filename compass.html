<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>試作：方位磁石の演出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="compass.css">
<style>
/* 演出だけを見るページ。演出の中身は compass.css・compass.js（自社商品のページ original.html と共通） */
*{box-sizing:border-box}
body{margin:0;background:var(--color-ground);color:var(--color-ink);font-family:'Zen Kaku Gothic New',sans-serif;font-size:16px;line-height:1.8}
/* 試作の確かめ用（本番では消す） */
.demo-replay{position:fixed;right:16px;bottom:16px;min-height:44px;padding:0 18px;border:1px solid var(--color-ink);background:transparent;color:var(--color-ink);font:inherit;cursor:pointer;border-radius:999px}
</style>
</head>
<body>
<section class="compass-hero" id="compass-hero"></section>
<button type="button" class="demo-replay" onclick="playCompass()">もう一度</button>
<script src="compass.js"></script>
</body>
</html>
