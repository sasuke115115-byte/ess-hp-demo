<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つくり手｜East Side Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>

<!-- ===== つくり手の一覧 =====
  一発で見たいもの：今受けられる人（「今受けられます／次は○月から」を一覧に出す）。
  つくり手を足す時は data.js の ESS.makers に1件足す（ここは触らない）。受けられる人を先に並べる。 -->

<div class="wrap"><section class="band knit">
  <div class="inner">
    <div class="patch">
      <p class="eyebrow">Makers</p>
      <h1>つくり手</h1>
      <p class="lead">あなたの服を仕立て直す人たちです。得意な素材と、今受けられるかを見て選べます。</p>
    </div>
  </div>
</section></div>

<div class="wrap"><section class="band gingham" data-seam>
  <div class="inner">
    <div class="grid" id="makers-list" data-render></div>
  </div>
</section></div>

<div class="wrap"><section class="band cord" data-seam>
  <div class="inner">
    <div class="patch dark" style="max-width:560px">
      <h2>頼みたい人が決まったら</h2>
      <p style="margin:14px 0 24px">LINE で、つくり手の名前を添えて送ってください。</p>
      <div data-line></div>
    </div>
  </div>
</section></div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
document.getElementById('makers-list').innerHTML = ESS.makers.slice()
  .sort(function(a, b){ return b.open - a.open; })
  .map(ESS.makerCard).join('');
</script>
</body>
</html>
